var gSitVer = "3.4.2"
var gSitURL = "GSit-${gSitVer}.jar"

dependencies {

    implementation 'com.github.AstralLiteratureClub:MoreForJava:1.0.2'
    implementation 'com.github.AstralLiteratureClub:MessageManager:2.4.1'
    implementation 'com.github.AstralLiteratureClub:GUIMan:1.3.1-3'
//    implementation 'com.github.AstralLiteratureClub:ChatGameCore:1.0.1'
    implementation 'com.github.AstralLiteratureClub:CloudPlusPlus:1.3.0'
//    implementation 'com.github.Antritus:Aura:-SNAPSHOT'

    // LOMBOK
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    // Armor Change Event
    implementation 'com.jeff-media:armor-equip-event:1.0.2'
    implementation 'com.jeff-media:MorePersistentDataTypes:2.4.0'
    // Reflections
    implementation 'io.github.classgraph:classgraph:4.8.165'
