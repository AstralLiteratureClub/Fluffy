    compileOnly 'me.clip:placeholderapi:2.11.5'

    // World Guard
    compileOnly('com.sk89q.worldedit:worldedit-bukkit:7.4.0-SNAPSHOT') {
        exclude group: 'com.google.guava', module: '*'
        exclude group: 'com.google.code.gson', module: '*'
        exclude group: 'org.apache.logging.log4j', module: '*'
    }
    compileOnly('com.sk89q.worldguard:worldguard-bukkit:7.1.0-SNAPSHOT') {
        exclude group: 'com.google.guava', module: '*'
        exclude group: 'com.google.code.gson', module: '*'
        exclude group: 'org.apache.logging.log4j', module: '*'
        exclude group: 'it.unimi.dsi', module: '*'
    }

    // Citizens
    compileOnly('net.citizensnpcs:citizens-main:2.0.35-SNAPSHOT') {
        exclude group: '*', module: '*'
    }
    // Sentinel (Citizens)
    compileOnly('org.mcmonkey:sentinel:2.9.2-SNAPSHOT') {
        exclude group: '*', module: '*'
    }

    var cloudVer = "2.0.0-beta.15"
    var cloudTranslationsVersion = "1.0.0-beta.2"
    implementation 'org.incendo:cloud-paper:'+cloudVer
    implementation 'org.incendo:cloud-brigadier:'+cloudVer
    implementation 'org.incendo:cloud-minecraft-extras:'+cloudVer
    implementation 'org.incendo:cloud-translations-bukkit:'+cloudTranslationsVersion

    // Manually downloaded using downloadGithubReleaseJar
    //
    compileOnly files('libs/'+gSitURL)



    // PAPER MC
    paperweight.paperDevBundle("1.21.4-R0.1-SNAPSHOT")
}

// 1. Define a reusable Custom Task Class at the bottom or in buildSrc
abstract class DownloadGitHubRelease extends DefaultTask {
    @Input
    abstract Property<String> getRepo()
    @Input
    abstract Property<String> getTag()
    @Input
    abstract Property<String> getAssetName()

    @OutputFile
    File getOutputFile() {
        return project.file("${project.projectDir}/libs/${getAssetName().get()}")
    }

    @TaskAction
    void download() {
        def downloadUrl = "https://github.com/${getRepo().get()}/releases/download/${getTag().get()}/${getAssetName().get()}"
        def outputDir = project.file("${project.projectDir}/libs")

        if (!outputDir.exists()) {
            outputDir.mkdirs()
        }

        println "Downloading ${getAssetName().get()} from GitHub..."
        new URL(downloadUrl).withInputStream { downloadStream ->
            getOutputFile().withOutputStream { fileStream ->
                fileStream << downloadStream
            }
        }
        println "Downloaded to ${getOutputFile().absolutePath}"
    }
}

// 2. Register as many instances of the task as you need
def downloadJarGSit = tasks.register('downloadGSit', DownloadGitHubRelease) {
    repo = "gecolay/GSit"
    tag = gSitVer
    assetName = gSitURL
}

/*
def downloadJarB = tasks.register('downloadJarB', DownloadGitHubRelease) {
    repo = "ownerB/repoB"
    tag = "v2.5.1"
    assetName = "projectB-2.5.1.jar"
}
 */

def downloadHooks = tasks.register("downloadHooks") {
    dependsOn downloadJarGSit
}

afterEvaluate {
    def hookTask = downloadHooks.get()

    hookTask.taskDependencies.getDependencies(hookTask).each { task ->
        if (task.hasProperty('download')) {
            task.download()
        } else if (task instanceof TaskProvider) {
            def actualTask = task.get()
            if (actualTask.respondsTo('download')) {
                actualTask.download()
            }
        }
    }
}

tasks.named('compileJava') {
    dependsOn downloadHooks
}

shadowJar {
    archiveClassifier = null
    /*
    relocate 'bet.astral.messenger', 'bet.astral.fluffy.libs.messenger'
    relocate 'bet.astral.tuples', 'bet.astral.fluffy.libs.tuples'
    relocate 'bet.astral.shine', 'bet.astral.fluffy.libs.shine'
    relocate 'bet.astral.cloudplusplus', 'bet.astral.fluffy.libs.cloudplusplus'
    relocate 'bet.astral.guiman', 'bet.astral.fluffy.libs.guiman'
     */
}

jar {
    enabled = false
    dependsOn(shadowJar)
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(21))
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching(['*.yml']) {
        expand([version: version])
    }
    filesMatching(['*.json']) {
        expand([version: version])
    }
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)
        }
    }
}

tasks {
    runServer {
        minecraftVersion("1.21.10")
    }
}